spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - api_key
      - api_secret
      - shop
      - start_date
    properties:
      shop:
        type: string
        description: >-
          The name of the store. For https://EXAMPLE.com, the shop name is
          'EXAMPLE.com'.
        order: 2
        title: Shop Name
      api_key:
        type: string
        description: Customer Key for API in WooCommerce shop
        order: 0
        title: Customer Key
        airbyte_secret: true
      api_secret:
        type: string
        description: Customer Secret for API in WooCommerce shop
        order: 1
        title: Customer Secret
        airbyte_secret: true
      start_date:
        type: string
        description: "The date you would like to replicate data from. Format: YYYY-MM-DD"
        order: 3
        title: Start Date
        format: date
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        examples:
          - "2021-01-01"
    additionalProperties: true

