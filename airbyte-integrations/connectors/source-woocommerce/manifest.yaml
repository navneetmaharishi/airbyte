version: 7.4.2

type: DeclarativeSource

description: >-
  The WooCommerce connector enables you to sync data from WooCommerce stores
  into Airbyte. It supports extracting core e-commerce data such as orders,
  customers, products, coupons, and refunds using the WooCommerce REST API,
  allowing you to replicate and analyse your store data in your destination of
  choice.

check:
  type: CheckStream
  stream_names:
    - system_status_tools

definitions:
  linked:
    SimpleRetriever:
      paginator:
        type: DefaultPaginator
        page_size_option:
          type: RequestOption
          field_name: per_page
          inject_into: request_parameter
        page_token_option:
          type: RequestOption
          field_name: offset
          inject_into: request_parameter
        pagination_strategy:
          type: OffsetIncrement
          page_size: 100
    HttpRequester:
      url_base: https://{{ config['shop'] }}/wp-json/wc/v3
      authenticator:
        type: BasicHttpAuthenticator
        password: "{{ config[\"api_secret\"] }}"
        username: "{{ config[\"api_key\"] }}"
      request_parameters:
        order: asc
        orderby: id
        dates_are_gmt: "true"

